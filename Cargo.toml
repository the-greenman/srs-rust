[workspace]
resolver = "2"
members = [
    "crates/srs-core",
    "crates/srs-schema",
    "crates/srs-repository",
    "crates/srs-cli",
    "crates/srs-projection",
    "crates/srs-bindings",
    "crates/srs-gov",
    "crates/srs-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/semanticops/srs"
authors = ["SemanticOps contributors"]

[workspace.dependencies]
srs-core = { path = "crates/srs-core" }
srs-schema = { path = "crates/srs-schema" }
srs-repository = { path = "crates/srs-repository" }
srs-projection = { path = "crates/srs-projection" }
srs-mcp = { path = "crates/srs-mcp" }
serde = { version = "1", features = ["derive"] }
# preserve_order: enabled deliberately (ADR-043, amending ADR-017/036/037) — the RFC-039
# carrier's fieldValues/fieldMeta key order is data ([R18]); determinism for everything
# else comes from canonical types + the .srsj canonicalize-on-write step, not from the
# old BTreeMap-backed Value re-sort.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
serde_path_to_error = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
unicode-normalization = "0.1"
base64 = "0.22"
# sha2 + hex: wasm32-safe (pure Rust); default-features = false ensures no std-only features (ADR-013)
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
# default-features = false is a wasm32 constraint (ADR-013); deflate uses flate2/miniz_oxide (pure Rust, wasm32-safe)
zip = { version = "2", default-features = false, features = ["deflate"] }
ratatui = "0.28"
crossterm = "0.28"
# MCP adapter surface (ADR-037): rmcp + tokio are referenced ONLY by srs-mcp.
# rmcp's serde_json tree audited under ADR-037; preserve_order is now enabled workspace-wide
# by ADR-043 (MCP JSON-RPC output is key-order-insensitive by protocol; snapshot tests verify).
rmcp = { version = "2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "time"] }
