[package]
name = "srs-mcp"
description = "MCP (Model Context Protocol) adapter over srs-repository services — thin server, no business logic (ADR-037)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
srs-mcp-core = { workspace = true }
srs-repository = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
srs-core = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
indexmap = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread"] }
rmcp = { workspace = true, features = ["client"] }
