[package]
name = "srs-mcp-core"
description = "WASM-safe JSON-RPC dispatcher contract for transport-agnostic SRS MCP applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
srs-repository = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Repository services allocate UUIDs for validated writes; use the browser
# entropy backend whenever this core is linked into the WASM executor.
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
