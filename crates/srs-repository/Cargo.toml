[package]
name = "srs-repository"
description = "SRS repository detection, file loading, package resolution, and index traversal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
srs-core = { workspace = true }
srs-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
base64 = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = { workspace = true }
zip = { workspace = true }
# ADR-011: schemars stays out of library crates by default. The `mcp-schema` feature (enabled
# only by srs-mcp-core) derives the MCP tool schema from the one shared create-input type
# (srs-rust#1157) instead of a hand-written mirror. Renamed: the workspace pins schemars 0.8.
schemars1 = { package = "schemars", version = "1", optional = true }

[features]
mcp-schema = ["dep:schemars1"]

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.29", default-features = false }
