[package]
name = "srs-repository"
description = "SRS repository detection, file loading, package resolution, and index traversal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
srs-core = { workspace = true }
srs-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
base64 = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = { workspace = true }
zip = { workspace = true }
# SVG safety check at attach (srs-rust#1607, decision 866167c1): no XML parser was in the
# workspace. Streaming, pure Rust (wasm32-safe), never expands entities or fetches DTDs; its
# only dependency, memchr, is already in the tree.
quick-xml = "0.42"
# ADR-011/ADR-037 amendment (srs-rust#1157): optional, enabled only by srs-mcp-core, which
# already depends on schemars 1, so no new crate enters any build. It derives the MCP tool
# schema from the one shared create-input type instead of a hand-written shadow copy. Not the
# workspace's schemars 0.8 (that one is srs-cli's payload-golden generator).
schemars = { version = "1", optional = true }

[features]
mcp-schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.29", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
