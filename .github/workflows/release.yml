name: Release

# Publish a GitHub Release with a prebuilt `srs` CLI binary on every merge to
# master (i.e. every merged PR). Each run produces a uniquely tagged release
# since the workspace version is pinned.
on:
  push:
    branches: [master]

# The default GITHUB_TOKEN needs write access to create releases and tags.
permissions:
  contents: write

# Avoid two merges racing to create releases at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release (linux x86_64)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p srs

      - name: Package binary
        id: package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "srs") | .version')
          sha_short=$(git rev-parse --short HEAD)
          tag="v${version}-build.${{ github.run_number }}"
          # Stable, build-independent asset names so the
          # /releases/latest/download/<name> URL never changes between builds.
          archive="srs-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$archive" -C target/release srs
          sha256sum "$archive" > "$archive.sha256"
          {
            echo "version=$version"
            echo "sha_short=$sha_short"
            echo "tag=$tag"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM bindings
        run: wasm-pack build crates/srs-bindings --target web --out-dir ../../dist/srs-bindings

      - name: Generate migrated governance seed
        run: |
          cargo run --release --bin generate-governance-seed -- \
            crates/srs-gov/assets/governance-seed.srsj \
            dist/srs-bindings/governance-seed.srsj

      - name: Package WASM bindings
        id: package_wasm
        run: |
          set -euo pipefail
          archive="srs-bindings-web.tar.gz"
          tar -czf "$archive" -C dist/srs-bindings .
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            "${{ steps.package_wasm.outputs.archive }}" \
            "${{ steps.package_wasm.outputs.archive }}.sha256" \
            scripts/gh-project.mjs \
            skills/SKILL.md \
            --target "${{ github.sha }}" \
            --title "srs v${{ steps.package.outputs.version }} (build ${{ github.run_number }}, ${{ steps.package.outputs.sha_short }})" \
            --notes "Automated release of the \`srs\` CLI built from \`${{ github.sha }}\`.

          **Platform:** \`x86_64-unknown-linux-gnu\`

          Stable download URL (always resolves to the newest build):
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.package.outputs.archive }} | tar -xz
          ./srs --help
          \`\`\`

          A matching \`${{ steps.package.outputs.archive }}.sha256\` is attached for verification.

          The project/priority tool \`gh-project.mjs\` is also attached (stable URL
          \`/releases/latest/download/gh-project.mjs\`); see \`docs/project-management.md\`.

          The \`srs-bindings\` WASM package (\`wasm-pack build crates/srs-bindings --target web\`
          output: \`.wasm\` + \`.js\` + \`.d.ts\`) is attached as \`${{ steps.package_wasm.outputs.archive }}\`
          (stable URL \`/releases/latest/download/${{ steps.package_wasm.outputs.archive }}\`), with a
          matching \`.sha256\` — consumers (e.g. srs-web) should fetch and extract this instead of
          running \`wasm-pack\` locally.

          The agent skill file \`SKILL.md\` is attached (stable URL
          \`/releases/latest/download/SKILL.md\`) — install it in any skills-capable agent
          (Claude Code, Codex, Cursor, Copilot, Goose) to add \"work with SRS repositories\"
          as a capability." \
            --latest

  # ---------------------------------------------------------------------------------------------
  # Corpus conformance gate (the-greenman/srs#392 row 2)
  # ---------------------------------------------------------------------------------------------
  # Every merge to master publishes a release humans and CI pull. Nothing checked that the binary
  # inside it can still read the corpora it exists to read. That has bitten by hand more than once
  # — a build that rejects a migrated corpus, or reads one as empty — and each time it was found by
  # a person and written down as a ledger warning. This makes it a red X.
  #
  # (An earlier draft of this comment attributed the silent-emptiness half specifically to
  # build.276. That does not reproduce: run against today's migrated corpora, build.276 fails
  # LOUDLY with `manifest parse error ... missing field 'instanceIndex'`. The emptiness check below
  # is kept on its merits — a zero-instance read is indistinguishable from a clean one by every
  # other signal — not on that attribution.)
  #
  # ORDERING: publish first, gate after. This is not a preference — gate-before-publish deadlocks.
  # The binary that performs a corpus migration is the binary the corpus needs in order to migrate:
  # withholding the release until the corpora already validate means a cutover can never start, so
  # the first deliberate breaking change would stop releases indefinitely with no way out except
  # disabling the gate. Publishing first keeps the escape hatch open (a consumer can still pin the
  # build deliberately) while the failure is loud and attributable beside it.
  #
  # FAILURE SEMANTICS: this job is required for the workflow to be green, but it is a SEPARATE job,
  # so a red gate never retracts or blocks the release itself. Its corpus checkouts always track
  # each repository's DEFAULT BRANCH, on the reasoning that a default branch is conformant by its
  # own repository's CI — `srs` has `release-drift.yml` today. For muDemocracy.org that backstop is
  # the conformance job added by srs#392 row 1, which lands in a SEPARATE PR of this unit: until
  # that merges, muSrs's default branch has no CI of its own, so this gate would be the first thing
  # to notice a break there rather than the second. Land row 1 first, or accept that ordering.
  #
  # So a corpus repo mid-migration reddens srs-rust only for as long as its own default branch is
  # non-conformant. It cannot redden srs-rust permanently, and the gate is deliberately not made
  # non-blocking: a gate that cannot fail is the thing this replaces.
  corpus-gate:
    name: Corpus conformance gate
    needs: release
    runs-on: ubuntu-latest
    # Read-only: this job validates, it never publishes. The workflow-level `contents: write` is
    # for the release job alone.
    permissions:
      contents: read
    env:
      # The `secrets` context is not available in a step-level `if:`, so the optional corpus token
      # is surfaced through `env`, which is. Empty when the secret is unset.
      CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
    steps:
      - name: Checkout srs-rust
        uses: actions/checkout@v4
        with:
          path: srs-rust

      # `srs` is PUBLIC, so the default GITHUB_TOKEN reads it — this is the same cross-repo checkout
      # `ci.yml`'s schema-drift job already does against it on every push and PR. Default branch
      # (no `ref:`); see the header note on failure semantics.
      #
      # `persist-credentials: false`: nothing here pushes, and the workflow-level token is
      # `contents: write`. Leaving it in a foreign repo's .git/config would put a write-scoped
      # credential on disk for a job that only reads.
      - name: Checkout srs (spec repo + gallery)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/srs
          path: corpora/srs
          persist-credentials: false

      # muDemocracy.org is PRIVATE, and this repository's GITHUB_TOKEN is an installation token
      # scoped to srs-rust alone — no `permissions:` key can widen it across repositories, and an
      # anonymous clone cannot read it either. Cross-repo private read needs a credential this
      # workflow does not have, so the muSrs leg is CONDITIONAL on one being supplied.
      #
      # Set a `CORPUS_TOKEN` secret on THIS repository to switch it on: a fine-grained PAT whose
      # repository access is muDemocracy.org alone, with `Contents: Read-only` and nothing else.
      # Named for the `BOARD_TOKEN` convention `srs` and `srs-web` already use — deliberately NOT a
      # second name with a `secrets.A || secrets.B` fallback, which is what board-sync.yml has to do
      # because this repo called the same thing BOARD_SECRET.
      #
      # It will expire; fine-grained PATs always do. When it does, the checkout fails and this job
      # goes red naming itself, which is the intended behaviour — see the note on
      # `continue-on-error` below. Without it the leg is SKIPPED — announced loudly by the step below, never
      # silently: a gate that quietly validates two corpora while its comments claim three is worth
      # less than no gate at all.
      #
      # NO `continue-on-error` here, deliberately. The `if` already covers the one benign case (no
      # secret configured). Once a secret IS configured, a failing checkout is a real failure —
      # PATs expire and access gets revoked routinely — and swallowing it would leave the gate
      # green over two of three corpora while the provenance step reported "no secret is set",
      # which is false. A configured-but-broken token must be red and must name itself.
      - name: Checkout muDemocracy.org (muSrs)
        id: musrs
        if: ${{ env.CORPUS_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/muDemocracy.org
          path: corpora/muDemocracy.org
          token: ${{ env.CORPUS_TOKEN }}
          persist-credentials: false

      # Which commit each corpus was at, so a gate failure can be attributed to a corpus change
      # rather than to the binary without re-running anything — and an explicit line when a corpus
      # was not fetched, so reduced coverage is visible in the log rather than inferred from the
      # absence of a line.
      #
      # Keyed on the checkout step's own outcome, not on a directory test. Two steps testing
      # different things for the same question disagree exactly when it matters: a `.git` test says
      # "fetched" while the corpus directory inside it has been renamed away.
      - name: Record corpus provenance
        env:
          MUSRS_OUTCOME: ${{ steps.musrs.outcome }}
        run: |
          echo "srs @ $(git -C corpora/srs rev-parse HEAD)"
          if [ "$MUSRS_OUTCOME" = "success" ]; then
            echo "muDemocracy.org @ $(git -C corpora/muDemocracy.org rev-parse HEAD)"
          else
            echo "::warning::muSrs was NOT validated by this gate — muDemocracy.org is private and no CORPUS_TOKEN secret is set. Set that secret to include it. NOTE: muSrs has no standing CI of its own until the-greenman/srs#392 row 1 (the muDemocracy.org conformance job) merges, so until then this skip means muSrs is validated by nothing on a schedule."
          fi

      # The PUBLISHED asset, not the local build. If the tarball is corrupt or the wrong artifact
      # got attached, that is exactly as bad as a binary that cannot read the corpus, and only
      # downloading what was published can catch it.
      - name: Download the release just published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --pattern "${{ needs.release.outputs.archive }}" \
            --pattern "${{ needs.release.outputs.archive }}.sha256" \
            --dir /tmp/srs-release

      - name: Verify checksum and extract
        working-directory: /tmp/srs-release
        run: |
          set -euo pipefail
          archive="${{ needs.release.outputs.archive }}"
          expected="$(awk '{print $1}' "$archive.sha256")"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::released archive does not match its published .sha256 (expected=$expected actual=$actual)"
            exit 1
          fi
          tar -xzf "$archive"
          chmod +x srs

      - name: Validate first-party corpora
        env:
          SRS: /tmp/srs-release/srs
          MUSRS_OUTCOME: ${{ steps.musrs.outcome }}
        run: |
          set -euo pipefail
          corpora=(
            "srs-spec=$GITHUB_WORKSPACE/corpora/srs/srs"
            "gallery=$GITHUB_WORKSPACE/corpora/srs/docs/spec/examples/gallery-project-v2"
          )
          # Keyed on whether the CHECKOUT ran, not on whether the corpus directory is there — the
          # same predicate the provenance step uses, for the same reason. Testing for the directory
          # would silently drop muSrs if it were renamed or removed inside a repository that was
          # fetched successfully, and dropping a corpus is precisely what
          # check-corpus-conformance.sh's "a corpus that vanished is not a corpus that passed"
          # error exists to prevent. Skipping when no token is configured is the only case that
          # should reduce coverage, and it is announced above.
          if [ "$MUSRS_OUTCOME" = "success" ]; then
            corpora+=("muSrs=$GITHUB_WORKSPACE/corpora/muDemocracy.org/muSrs")
          fi
          srs-rust/scripts/check-corpus-conformance.sh "${corpora[@]}"
