name: Board sync

# Reconciles Project #5 and promotes work onto the Ready queue. Runs on three triggers:
#   - push to master  — reconcile right after each merge (closed→Done, re-derive priorities)
#   - schedule (hourly) — promote `promote:ready` intents even during quiet periods, so the
#                         Ready queue refills at the same cadence the hourly consumer drains it;
#                         also the cadence stale-claims relies on to recover dead claims same-day
#   - workflow_dispatch — lets a cloud Claude session (or a human) trigger promotion on demand
#                         via `gh workflow run board-sync.yml` after it has judged/labelled issues
#
# The `promote` step is the privileged half of the promotion pipeline: a REST-only judge (the
# progress-review cloud routine, a human, or a future rule) marks unblocked issues with the
# `promote:ready` label — it cannot set the board Status through its proxy — and this job converts
# that intent into board Status=Ready (which then mirrors to the `ready` label). See
# docs/project-management.md → "Promotion pipeline".
#
# The `stale-claims` step is the recovery half: nothing else ever revisits an issue sitting in
# `In progress` (`promote` explicitly skips advanced statuses; `reconcile` only mirrors the label),
# so a claim whose holder crashed or timed out would otherwise be invisible forever. It resets any
# claim older than the default threshold back to Status=Ready. See docs/project-management.md →
# "Recovering a stale claim".
#
# Requires a PAT with `project` scope stored as the BOARD_SECRET secret
# (BOARD_TOKEN also accepted). The default GITHUB_TOKEN does not carry project
# scope for user-level Projects v2. If the secret is absent the job FAILS —
# a silent skip lets the label mirror drift from the board unnoticed.
#
# This is the ONLY board-sync workflow in the ecosystem. It reconciles the
# whole cross-repo board on every trigger, so per-repo copies are unnecessary;
# the hourly schedule covers merges in the other repos within the hour, and
# `gh workflow run board-sync.yml --repo the-greenman/srs-rust` forces it.

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 * * * *'   # hourly — promote intents + reconcile (UTC)
  workflow_dispatch:

# Never let a scheduled run and a push run stomp each other's board writes.
concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    name: Promote, reconcile & rollup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONE invocation, ONE process (#664): `sync` runs the whole pipeline
      # (stories-sync → rollup → release-sync → topup → promote → stale-claims →
      # reconcile) on a single board fetch and a batched sub-issue prefetch. The
      # previous six separate invocations each re-fetched the board and re-walked
      # the sub-issue graph one REST call per issue — thousands of API requests per
      # day, regular rate-limit stalls. Do not split this back into per-step calls.
      - name: Sync the board (rollup, release, topup, promote, stale-claims, reconcile)
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Board PAT not set — board sync cannot run. Add a PAT with 'project' scope as the BOARD_SECRET secret. A silent skip here means labels drift from the board and routines pick up stale work, so this is a hard failure."
            exit 1
          fi
          node scripts/gh-project.mjs sync
        env:
          # Accept either secret name; BOARD_SECRET is the one currently configured.
          GH_TOKEN: ${{ secrets.BOARD_SECRET || secrets.BOARD_TOKEN }}
